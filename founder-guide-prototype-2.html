:0}}}],glossary:{bootstrapping:`Funding your business with your own money or revenue, instead of outside investors or loans.`,"break-even":`The point where your revenue covers all your costs — you're not losing or gaining money.`,SAFE:`Simple Agreement for Future Equity — a common early-stage document where an investor gives you money now in exchange for equity later, without setting a valuation yet.`,crowdfunding:`Raising smaller amounts of money from many people at once, usually online (e.g. Kickstarter, Wefunder).`,"non-dilutive":`Funding that doesn't require giving up any ownership (equity) in your business — like a grant.`,"R&D":`Research & Development — designing, testing, and improving a new product before it's ready to sell.`,"SBIR/STTR":`Small Business Innovation Research / Small Business Technology Transfer — U.S. federal grant programs funding small businesses doing research-based work.`,microloan:`A small loan (often under $50K–$150K) designed for early-stage businesses that may not qualify for a traditional bank loan.`,"personal guarantee":`A promise that you'll personally repay a business loan out of your own assets if the business can't.`,collateral:`Property or assets (like equipment or savings) you pledge to a lender that they can claim if you don't repay a loan.`,equity:`Ownership in your company — when you give someone equity, they own a percentage of the business.`,dilutive:`Reduces your ownership percentage — happens whenever you sell equity to raise money.`,"priced round":`A funding round where investors and the company agree on a specific company valuation up front (unlike a SAFE, which defers that).`,"cap table":`Capitalization table — a record of who owns what percentage of your company.`,"venture capital":`Money from professional investment firms (VCs) that invest other people's money into high-growth startups in exchange for equity.`,"follow-on funding":`Additional investment from the same investors in a later funding round.`,"board seats"
